[project]
name = "travelmate-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real external APIs (run with -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
